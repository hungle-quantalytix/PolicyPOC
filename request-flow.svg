<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Styles -->
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #333; stroke-width: 2; }
      .text { font-family: sans-serif; font-size: 14px; text-anchor: middle; fill: #333; }
      .title { font-weight: bold; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .container-box { fill: none; stroke: #666; stroke-width: 2; stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Main Container -->
  <rect x="20" y="20" width="760" height="560" class="container-box" />
  <text x="400" y="50" class="text title" style="font-size: 18px;">Request Flow</text>

  <!-- Top Row -->
  <g transform="translate(50, 80)">
    <!-- Client -->
    <rect x="0" y="0" width="140" height="60" class="box" />
    <text x="70" y="25" class="text title">Client</text>
    <text x="70" y="45" class="text">(JWT)</text>
    
    <!-- Arrow to Auth -->
    <path d="M140 30 L190 30" class="arrow" />

    <!-- Authentication -->
    <rect x="200" y="0" width="160" height="60" class="box" />
    <text x="280" y="25" class="text title">Authentication</text>
    <text x="280" y="45" class="text">(JWT Validation)</text>

    <!-- Arrow to Middleware -->
    <path d="M360 30 L410 30" class="arrow" />

    <!-- Policy Middleware -->
    <rect x="420" y="0" width="180" height="60" class="box" />
    <text x="510" y="25" class="text title">Policy Middleware</text>
    <text x="510" y="45" class="text">(QtxPolicyMiddleware)</text>
  </g>

  <!-- Arrow Down from Middleware -->
  <path d="M560 140 L560 190" class="arrow" />

  <!-- Permission Service -->
  <g transform="translate(420, 200)">
    <rect x="0" y="0" width="280" height="80" class="box" />
    <text x="140" y="25" class="text title">Permission Service</text>
    <text x="140" y="45" class="text">(Priority Eval:</text>
    <text x="140" y="65" class="text">Policy→Role→User)</text>
  </g>

  <!-- Branching Arrows from Permission Service -->
  <!-- To Security Context -->
  <path d="M490 280 L200 350" class="arrow" style="marker-end: none;" /> <!-- Diagonal part -->
  <path d="M200 350 L200 370" class="arrow" /> <!-- Vertical part -->
  
  <!-- To RLS -->
  <path d="M560 280 L560 370" class="arrow" />
  
  <!-- To FLS -->
  <path d="M630 280 L720 350" class="arrow" style="marker-end: none;" /> <!-- Diagonal part -->
  <path d="M720 350 L720 370" class="arrow" /> <!-- Vertical part -->

  <!-- Bottom Row Components -->
  <g transform="translate(0, 380)">
    <!-- Security Context Service -->
    <rect x="100" y="0" width="200" height="60" class="box" />
    <text x="200" y="25" class="text title">Security Context</text>
    <text x="200" y="45" class="text">Service</text>

    <!-- RLS Rules -->
    <rect x="460" y="0" width="160" height="60" class="box" />
    <text x="540" y="25" class="text title">RLS Rules</text>
    <text x="540" y="45" class="text">(Row Filters)</text>

    <!-- FLS Rules -->
    <rect x="660" y="0" width="120" height="60" class="box" />
    <text x="720" y="25" class="text title">FLS Rules</text>
    <text x="720" y="45" class="text">(Masks)</text>
  </g>

  <!-- Arrow from RLS to Security Context -->
  <path d="M460 410 L310 410" class="arrow" />

  <!-- Arrow from Security Context to Controller -->
  <path d="M200 440 L200 490" class="arrow" />

  <!-- Controller -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="200" height="70" class="box" />
    <text x="100" y="25" class="text title">Controller</text>
    <text x="100" y="45" class="text">(Apply RLS +</text>
    <text x="100" y="65" class="text">FLS to Query)</text>
  </g>
</svg>