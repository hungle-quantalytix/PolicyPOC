<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register • PolicyPOC</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
    <style>
        html,
        body {
            min-height: 100%;
            background: radial-gradient(circle at top, #f8fafc, #e2e8f0);
        }

        [x-cloak] {
            display: none !important;
        }

        .htmx-indicator {
            opacity: 0;
            transition: opacity 150ms ease;
        }

        .htmx-indicator.htmx-request {
            opacity: 1;
        }
    </style>
</head>

<body class="py-5">
    <div id="navbar-placeholder"></div>

    <div class="container" style="margin-top: 6rem;" x-data="registerUi()" x-cloak>
        <div class="row justify-content-center">
            <div class="col-xl-8">
                <div class="card shadow border-0">
                    <div class="card-body p-4 p-md-5">
                        <p class="text-uppercase text-muted fw-semibold mb-1">Onboarding</p>
                        <div class="mb-4">
                            <h1 class="h3 mb-2">Create a new account</h1>
                            <p class="text-muted mb-0">Fill out the form below to get started.</p>
                        </div>

                        <form class="needs-validation" novalidate
                              hx-post="/api/auth/register"
                              hx-ext="json-enc"
                              hx-encoding="json"
                              hx-target="#register-response"
                              hx-indicator="#register-spinner">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="register-name" class="form-label">Display name</label>
                                    <input id="register-name" name="displayName" type="text" class="form-control form-control-lg" placeholder="Jane Doe" required minlength="3">
                                </div>
                                <div class="col-md-6">
                                    <label for="register-email" class="form-label">Email address</label>
                                    <input id="register-email" name="email" type="email" class="form-control form-control-lg" placeholder="new-user@example.com" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="register-password" class="form-label">Password</label>
                                    <input id="register-password" name="password" type="password" class="form-control form-control-lg" placeholder="At least 6 characters" required minlength="6"
                                           x-ref="registerPassword" @input="updateMatch()">
                                </div>
                                <div class="col-md-6">
                                    <label for="register-password-confirm" class="form-label">Confirm password</label>
                                    <input id="register-password-confirm" type="password" class="form-control form-control-lg" placeholder="Re-enter password" required minlength="6"
                                           x-ref="registerConfirm"
                                           @input="updateMatch()">
                                    <div class="form-text" :class="matching ? 'text-success' : 'text-danger'">
                                        <span x-text="matching ? 'Passwords match.' : 'Passwords must match.'"></span>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex align-items-center gap-3 mt-4">
                                <button type="submit" class="btn btn-success btn-lg flex-grow-1" :disabled="!matching">
                                    Create Account
                                </button>
                                <div id="register-spinner" class="spinner-border text-success htmx-indicator" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </form>

                        <div id="register-response" data-response-target class="mt-4"></div>

                        <div class="alert alert-secondary mt-4 mb-0">
                            <div class="d-flex justify-content-between flex-wrap gap-2 align-items-center">
                                <div>
                                    <h2 class="h6 mb-1">Already registered?</h2>
                                    <p class="mb-0 small text-muted">Jump to the login page and exchange your credentials for a token.</p>
                                </div>
                                <a class="btn btn-outline-primary btn-sm" href="/login.html">Go to login</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/register.js"></script>
</body>

</html>
