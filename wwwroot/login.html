<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login • PolicyPOC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
    <style>
        html,
        body {
            min-height: 100%;
            background: radial-gradient(circle at top, #f8fafc, #e2e8f0);
        }

        [x-cloak] {
            display: none !important;
        }

        .htmx-indicator {
            opacity: 0;
            transition: opacity 150ms ease;
        }

        .htmx-indicator.htmx-request {
            opacity: 1;
        }
    </style>
</head>

<body class="py-5">
    <div id="navbar-placeholder"></div>

    <div class="container" style="margin-top: 6rem;" x-data>
        <div class="row justify-content-center">
            <div class="col-xl-7">
                <div class="card shadow border-0">
                    <div class="card-body p-4 p-md-5">
                        <p class="text-uppercase text-muted fw-semibold mb-1">Authentication</p>
                        <div class="mb-4">
                            <h1 class="h3 mb-2">Sign in to PolicyPOC</h1>
                            <p class="text-muted mb-0">Enter your credentials to access your account.</p>
                        </div>

                        <form class="needs-validation" novalidate
                              hx-post="/api/auth/login"
                              hx-ext="json-enc"
                              hx-encoding="json"
                              hx-target="#login-response"
                              hx-indicator="#login-spinner">
                            <div class="mb-3">
                                <label for="login-email" class="form-label">Email address</label>
                                <input id="login-email" name="email" type="email" class="form-control form-control-lg" placeholder="you@example.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="login-password" class="form-label">Password</label>
                                <input id="login-password" name="password" type="password" class="form-control form-control-lg" placeholder="Your password" required minlength="6">
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <button type="submit" class="btn btn-primary btn-lg flex-grow-1">
                                    Login
                                </button>
                                <div id="login-spinner" class="spinner-border text-primary htmx-indicator" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </form>

                        <div id="login-response" data-response-target class="mt-4"></div>

                        <div class="alert alert-secondary mt-4 mb-0">
                            <div class="d-flex justify-content-between flex-wrap gap-2 align-items-center">
                                <div>
                                    <h2 class="h6 mb-1">Need an account?</h2>
                                    <p class="mb-0 small text-muted">Head over to registration and come back here to grab a JWT.</p>
                                </div>
                                <a class="btn btn-outline-success btn-sm" href="/register.html">Create account</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
